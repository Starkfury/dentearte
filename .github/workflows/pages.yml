name: Publicar site DenteArte

on:
  push:
    branches: [main]
    paths: ['site.zip']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter a exportação pública
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Extrair o site
        run: |
          unzip -q site.zip -d _site
          test -f _site/index.html
          rm -f _site/_headers _site/.htaccess _site/.site-export.json
      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
